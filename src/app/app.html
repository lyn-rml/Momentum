<a class="skip-link" href="#main-content">Skip to content</a>
<div class="app-shell">
  <app-sidebar />
  <div class="workspace" [class.quote-workspace]="minimalLayout">
    @if (!minimalLayout) {
      <header class="workspace-header">
        <span class="eyebrow">A DAILY DOSE OF PERSPECTIVE</span>
        <div class="appearance" role="group" aria-label="Color mode">
          <button
            type="button"
            [attr.aria-pressed]="preferences.theme() === 'light'"
            (click)="preferences.selectTheme('light')"
          >
            Light
          </button>
          <span aria-hidden="true">/</span>
          <button
            type="button"
            [attr.aria-pressed]="preferences.theme() === 'dark'"
            (click)="preferences.selectTheme('dark')"
          >
            Dark
          </button>
        </div>
      </header>
    }
    <main id="main-content" tabindex="-1">
      <router-outlet (activate)="onPageActivated()" />
    </main>
    @if (!minimalLayout) {
      <footer class="workspace-footer">
        <span>Make room for a good thought.</span
        ><span>Momentum <span aria-hidden="true">↗</span></span>
      </footer>
    }
  </div>
</div>
